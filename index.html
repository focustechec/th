<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Aplicación AppSheet</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="app" allow="geolocation *; camera *; microphone *; fullscreen *; clipboard-write *"></iframe>
  <script>
    const APP = "https://www.appsheet.com/start/686cd7d3-250e-4f89-a45a-d8b406cd01af";
    document.getElementById("app").src = APP + (location.hash || "");
    if (location.hash) history.replaceState(null, "", location.pathname);
    window.addEventListener("pageshow", e => { if (e.persisted) location.reload(); });
  </script>
</body>
</html>
