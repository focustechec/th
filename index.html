<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcación Focus</title>

  <!-- Ícono y nombre del atajo -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-title" content="Marcación">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2563eb">

  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="app" allow="geolocation *; camera *; microphone *; fullscreen *; clipboard-write *"></iframe>
  <script>
    const APP = "https://www.appsheet.com/start/686cd7d3-250e-4f89-a45a-d8b406cd01af";
    document.getElementById("app").src = APP + (location.hash || "");
    if (location.hash) history.replaceState(null, "", location.pathname);
    window.addEventListener("pageshow", e => { if (e.persisted) location.reload(); });
  </script>
</body>
</html>
